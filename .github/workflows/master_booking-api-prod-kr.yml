name: Build and deploy ASP.Net Core app to Azure Web App - booking-api-prod-kr

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Find Booking.Api project
        shell: bash
        run: |
          echo "Searching for Booking.Api.csproj..."
          find . -name "Booking.Api.csproj" -print
          API_CSPROJ=$(find . -name "Booking.Api.csproj" -print -quit)
          if [ -z "$API_CSPROJ" ]; then
            echo "Booking.Api.csproj not found!" >&2
            exit 1
          fi
          echo "API_CSPROJ=$API_CSPROJ" >> $GITHUB_ENV
          echo "Found: $API_CSPROJ"

      - name: Build (Booking.Api)
        run: dotnet build "${{ env.API_CSPROJ }}" --configuration Release

      - name: Publish (Booking.Api)
        run: dotnet publish "${{ env.API_CSPROJ }}" -c Release -o ${{ runner.temp }}/publish_api

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: api_publish
          path: ${{ runner.temp }}/publish_api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api_publish
          path: api_publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_735F7D60A58D4F2F80D1B0B15FF45A2A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_683271B3D84F4FD6AE2C7AAFFCDA5B91 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CB129D52C8EF4176B8D3CD98D9CDE4C5 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'booking-api-prod-kr'
          slot-name: 'Production'
          package: api_publish
